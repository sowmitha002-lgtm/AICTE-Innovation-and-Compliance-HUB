<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClearPath | AICTE Approval and Compliance Hub</title>
<style>
:root{--navy:#12243a;--blue:#315ee7;--teal:#18a999;--bg:#f4f7fb;--text:#1e293b;--mut:#64748b;--line:#e3e9f2;--green:#087a54;--amber:#9a6800;--red:#b83a3a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,select,input{font:inherit}
.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}
.side{background:var(--navy);color:#dce6f5;padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6ee7d8,#4874ff);display:grid;place-items:center;color:#10253c;font-weight:900;font-size:19px}
.brand strong{display:block;color:#fff;font-size:17px}.brand small{color:#a9bad2;font-size:9px;letter-spacing:.5px}
.nav button{width:100%;border:0;background:none;color:#c3d0e3;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;cursor:pointer}
.nav button.on,.nav button:hover{background:#243b59;color:#fff}
.note{margin-top:auto;border:1px solid #344b68;background:#1a304a;padding:12px;border-radius:12px;font-size:12px;color:#b9c9dd}.note b{display:block;color:#fff;margin-bottom:4px}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px;flex-wrap:wrap}
.crumb{color:var(--mut)}.crumb b{color:var(--text)}.tr{display:flex;gap:10px;align-items:center}
.demo{font-size:10px;color:#8a5b00;background:#fff5d9;border:1px solid #f8e5a9;border-radius:30px;padding:6px 10px;font-weight:800}
select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--text)}
.content{padding:26px 28px;max-width:1300px;margin:auto}
h1{margin:0 0 4px;font-size:25px;letter-spacing:-.5px}.sub{margin:0 0 20px;color:var(--mut)}
h2{font-size:15px;margin:0}
.btn{border:0;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{background:#244ed0}.btn.l{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.d{background:#fff0f0;color:var(--red);border:1px solid #ffd4d4}
button:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat span{color:var(--mut);font-size:12px}.stat strong{display:block;font-size:28px;letter-spacing:-1px;margin-top:6px}
.panel{margin-bottom:16px}.ph{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pb{padding:16px 18px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:#8794a8;font-size:11px;padding:10px 14px;background:#fbfcfe;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #edf1f6;vertical-align:top}
tr:last-child td{border-bottom:0}.sm{display:block;font-size:12px;color:var(--mut)}
.pill{display:inline-block;padding:2px 9px;border-radius:30px;font-size:11px;font-weight:800}
.ok{background:#e0f7ed;color:var(--green)}.warn{background:#fff4d8;color:var(--amber)}.bad{background:#ffe7e7;color:var(--red)}.blue{background:#e8efff;color:var(--blue)}
.bar{height:8px;background:#e8edf5;border-radius:5px;overflow:hidden;margin-top:5px;min-width:90px}.bar i{display:block;height:100%}
.steps{display:flex;gap:4px;margin:10px 0}.steps div{flex:1;padding:7px 4px;text-align:center;font-size:12px;border-radius:7px;background:#edf1f6;color:var(--mut)}
.steps .done{background:#e0f7ed;color:var(--green)}.steps .now{background:var(--blue);color:#fff}
.al{padding:10px 14px;border-left:4px solid #f59e0b;background:#fff8e6;border-radius:0 8px 8px 0;margin-bottom:8px}.al.r{border-color:#e45757;background:#fff0f0}
.lg{padding:9px 0;border-bottom:1px solid #edf1f6;font-size:13px;color:var(--mut)}.lg b{color:var(--text)}
.cols{display:flex;align-items:end;gap:14px;height:150px}.cols div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.cols i{display:block;background:var(--blue);border-radius:6px 6px 0 0;margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:center;padding:7px 0;flex-wrap:wrap}.chk .pill{min-width:72px;text-align:center}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:42px 32px;margin-bottom:18px}
.hero h1{font-size:30px;max-width:24ch;line-height:1.2;margin-bottom:12px}.hero p{max-width:60ch;color:#c3d0e3;margin:0 0 20px}.hero .btn{background:#fff;color:var(--navy)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:9px}
footer{padding:16px 28px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{display:flex;flex-wrap:wrap;gap:2px}.nav button{width:auto}.note{display:none}.stats,.grid4,.two{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.content{padding:18px 14px}.hero h1{font-size:24px}}
@media(max-width:520px){.stats,.grid4{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><div class="logo">C</div><div><strong>ClearPath</strong><small>AICTE APPROVAL AND COMPLIANCE HUB</small></div></div>
<nav class="nav" id="nav"></nav><div class="note"><b id="coll"></b>Smart India Hackathon<br>Problem Statement 4</div></aside>
<main><div class="top"><div class="crumb">Signed in as <b id="who"></b></div><div class="tr"><label>Role <select id="role"><option value="inst">Institution</option><option value="off">AICTE Officer</option><option value="adm" selected>Admin</option></select></label><span class="demo">DEMO DATA</span></div></div>
<div class="content" id="app"></div><footer id="foot"></footer></main></div><div id="toast" class="toast" hidden></div>
<script>
const COLLEGE="K.S.R. College of Engineering",KEY="clearpath-aicte-v1";
const STAGES=["Submitted","Scrutiny","Inspection","Decision"],SLA=[2,5,7,3];
const DOCS={"New approval":["Land document","Trust registration","Faculty list","Fire safety certificate","Audited accounts"],"Extension of approval":["Faculty list","Fire safety certificate","Audited accounts","Previous approval letter"],"Closure":["Closure resolution","Student transfer plan","No-dues certificate"]};
const NAMES=["K.S.R. College of Engineering","Kaveri College of Engineering","Nandha College of Technology","Kongu Engineering College","Vivekanandha College of Engineering for Women","Mahendra College of Technology","Erode Sengunthar Engineering College","Al-Ameen Engineering College"];
const NAV={inst:[["home","Home"],["mine","My application"],["alerts","Alerts and activity"]],off:[["home","Home"],["queue","Applications"],["comp","Compliance"],["alerts","Alerts and activity"]],adm:[["home","Home"],["over","Overview"],["queue","Applications"],["comp","Compliance"],["alerts","Alerts and activity"],["data","Data and backup"]]};
const ROLE={inst:"Institution",off:"AICTE Officer",adm:"Admin"};
let S,me=0,role="adm",page="home";
const stamp=(who,what)=>({t:new Date().toLocaleString("en-IN"),who,what});
function seed(){const t=Object.keys(DOCS);S={log:[stamp("System","Demo data loaded")],apps:NAMES.map((x,i)=>{const ty=t[i%3];return{id:"APP-"+(1001+i),inst:x,type:ty,stage:i%4,days:[1,6,3,9,2,4,8,1][i],docs:Object.fromEntries(DOCS[ty].map((d,j)=>[d,(i+j)%5!==0?(i===3&&j===0?"expired":"ok"):"missing"])),complaints:[0,1,0,2,0,0,1,0][i],status:"Active"}})}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.apps)seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const missing=a=>Object.values(a.docs).filter(v=>v==="missing").length,expired=a=>Object.values(a.docs).filter(v=>v==="expired").length;
const overdue=a=>a.status==="Active"&&a.days>SLA[a.stage];
const score=a=>Math.max(0,100-missing(a)*12-expired(a)*10-a.complaints*8-(overdue(a)?15:0));
const cls=s=>s>=75?"ok":s>=50?"warn":"bad",col=s=>s>=75?"#169b72":s>=50?"#f59e0b":"#e45757";
const sbar=s=>`<div class="bar"><i style="width:${s}%;background:${col(s)}"></i></div>`;
const stCls=a=>a.status==="Approved"?"ok":a.status==="Rejected"?"bad":"blue";
function alerts(a){const o=[];if(a.status!=="Active")return o;if(missing(a))o.push([0,`${a.id}: ${missing(a)} document(s) missing`]);if(expired(a))o.push([1,`${a.id}: a certificate has expired`]);if(overdue(a))o.push([1,`${a.id}: ${a.days} days in ${STAGES[a.stage]} (limit ${SLA[a.stage]}). Escalated to supervisor`]);if(a.complaints)o.push([0,`${a.id}: ${a.complaints} open complaint(s)`]);return o}
const steps=a=>`<div class="steps">${STAGES.map((s,i)=>`<div class="${a.status==="Approved"||i<a.stage?"done":i===a.stage&&a.status==="Active"?"now":""}">${s}</div>`).join("")}</div>`;
const stat=(l,v)=>`<div class="stat"><span>${l}</span><strong>${v}</strong></div>`;
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,2200)}
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
const go=p=>{page=p;render()};
function vHome(){const F=[["Submitted","The institution files its application and documents."],["Scrutiny","Officers check the documents and details."],["Inspection","Facilities and claims are verified."],["Decision","The application is approved or rejected."]];
const R=[["Institution","Applies, uploads documents, tracks status, sees its own alerts and score."],["AICTE officer","Works a review queue, moves files between stages, requests changes, approves or rejects."],["Admin","Sees files per stage, escalations, the compliance ranking and the audit trail."]];
const X=[["Smart checklist","Required documents change with the application type."],["Time limits","Every stage has a deadline. Late files escalate to the supervisor."],["Compliance score","A live 0 to 100 score from documents, expiry dates, complaints and delays."],["Alerts and audit trail","Problems are flagged as they happen and every action is recorded."]];
return`<div class="hero"><h1>Every institution approval, tracked from application to decision</h1><p>One place for institutions to apply, for AICTE officers to review on time, and for leadership to see which files are stuck and which institutions need attention.</p><button class="btn" onclick="go(NAV[role][1][0])">Open the portal</button></div>
<div class="panel"><div class="ph"><h2>About AICTE</h2></div><div class="pb"><p style="margin:0;max-width:78ch">The All India Council for Technical Education (AICTE) is the national body for technical education in India. It began as an advisory body in 1945 and received statutory status through the AICTE Act, 1987. One of its core duties is to approve institutions offering technical programmes in engineering, management, pharmacy, architecture and related fields, and to review that approval every year. ClearPath is built around that approval cycle.</p></div></div>
<h2 style="margin-bottom:10px">How an application moves</h2><div class="grid4">${F.map((x,i)=>`<div class="stat"><div class="steps" style="margin:0 0 8px"><div class="${i?"":"now"}">${x[0]}</div></div><span>${x[1]}</span></div>`).join("")}</div>
<div class="two"><div class="panel"><div class="ph"><h2>Who uses it</h2></div><div class="tw"><table>${R.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td></tr>`).join("")}</table></div></div>
<div class="panel"><div class="ph"><h2>What it adds</h2></div><div class="tw"><table>${X.map(x=>`<tr><td><b>${x[0]}</b><span class="sm">${x[1]}</span></td></tr>`).join("")}</table></div></div></div>`}
function vMine(){const a=S.apps[me],al=alerts(a);
return head("My application","Track your approval, fix document gaps and see your compliance score.")+`<div class="panel"><div class="ph"><div><h2>${a.inst}</h2><span class="sm">${a.id} · ${a.type}</span></div><label>Demo institution <select onchange="me=+this.value;render()">${S.apps.map((x,i)=>`<option value="${i}" ${i===me?"selected":""}>${x.inst} (${x.id})</option>`).join("")}</select></label></div>
<div class="pb">${steps(a)}<p style="margin:6px 0">Status <span class="pill ${stCls(a)}">${a.status}</span> · ${a.days} day(s) in ${STAGES[a.stage]}</p><p style="margin:6px 0">Compliance score <b>${score(a)}/100</b></p>${sbar(score(a))}</div></div>
<div class="two"><div class="panel"><div class="ph"><h2>Document checklist: ${a.type}</h2></div><div class="pb">${Object.entries(a.docs).map(([d,v])=>`<div class="chk"><span class="pill ${v==="ok"?"ok":v==="expired"?"warn":"bad"}">${v==="ok"?"Uploaded":v==="expired"?"Expired":"Missing"}</span>${d}${v!=="ok"?` <button class="btn l" onclick="up('${d}')">Upload valid file</button>`:""}</div>`).join("")}</div></div>
<div><div class="panel"><div class="ph"><h2>Alerts for you</h2></div><div class="pb">${al.length?al.map(x=>`<div class="al ${x[0]?"r":""}">${x[1]}</div>`).join(""):"No alerts. Your application is on track."}</div></div>
<div class="panel"><div class="ph"><h2>New application</h2></div><div class="pb"><select id="nt">${Object.keys(DOCS).map(t=>`<option>${t}</option>`).join("")}</select> <button class="btn" onclick="newApp()">Create</button></div></div></div></div>`}
function up(d){const a=S.apps[me];a.docs[d]="ok";S.log.unshift(stamp(a.inst,`Uploaded "${d}" for ${a.id}`));toast("Document uploaded");render()}
function newApp(){const t=document.getElementById("nt").value,a=S.apps[me];S.apps.push({id:"APP-"+(1001+S.apps.length),inst:a.inst,type:t,stage:0,days:0,docs:Object.fromEntries(DOCS[t].map(d=>[d,"missing"])),complaints:a.complaints,status:"Active"});me=S.apps.length-1;S.log.unshift(stamp(a.inst,`Created ${t} application`));toast("Application created");render()}
function vQueue(){const rows=S.apps.map((a,i)=>[a,i]).sort((x,y)=>(y[0].status==="Active")-(x[0].status==="Active")||overdue(y[0])-overdue(x[0]));
return head("Applications",role==="off"?"Overdue files come first. Move each file forward, ask for changes, or decide.":"All applications, with overdue files first.")+`<div class="panel"><div class="tw"><table><tr><th>Application</th><th>Stage</th><th>Time</th><th>Documents</th><th>Score</th><th>${role==="off"?"Action":"Status"}</th></tr>
${rows.map(([a,i])=>`<tr><td><b>${a.inst}</b><span class="sm">${a.id} · ${a.type}</span></td><td>${STAGES[a.stage]}</td><td>${a.status==="Active"?`<span class="pill ${overdue(a)?"bad":"ok"}">${a.days}/${SLA[a.stage]} days</span>`:"-"}</td>
<td>${missing(a)?missing(a)+" missing":"Complete"}${expired(a)?", "+expired(a)+" expired":""}</td><td><span class="pill ${cls(score(a))}">${score(a)}</span></td>
<td>${role==="off"&&a.status==="Active"?`<button class="btn" onclick="act(${i},'adv')">${a.stage===3?"Approve":"Move to "+STAGES[a.stage+1]}</button> <button class="btn l" onclick="act(${i},'chg')">Request changes</button> <button class="btn d" onclick="act(${i},'rej')">Reject</button>`:`<span class="pill ${a.status==="Active"?"warn":stCls(a)}">${a.status}</span>`}</td></tr>`).join("")}</table></div></div>`}
function act(i,k){const a=S.apps[i];if(k==="adv"){if(a.stage===3){if(missing(a)||expired(a)){toast("Cannot approve: documents missing or expired");return}a.status="Approved";S.log.unshift(stamp("Officer","Approved "+a.id))}else{a.stage++;a.days=0;S.log.unshift(stamp("Officer",`Moved ${a.id} to ${STAGES[a.stage]}`))}}
if(k==="chg"){a.days=0;S.log.unshift(stamp("Officer","Requested changes on "+a.id))}if(k==="rej"){a.status="Rejected";S.log.unshift(stamp("Officer","Rejected "+a.id))}render()}
function vComp(){const A=[...S.apps].sort((x,y)=>score(x)-score(y));
return head("Compliance tracker","Institutions ranked from lowest to highest compliance score.")+`<div class="panel"><div class="tw"><table><tr><th>Institution</th><th>Score</th><th>Missing</th><th>Expired</th><th>Complaints</th><th>Overdue</th></tr>
${A.map(a=>`<tr><td><b>${a.inst}</b><span class="sm">${a.id} · ${a.status}</span></td><td style="min-width:130px"><span class="pill ${cls(score(a))}">${score(a)}</span>${sbar(score(a))}</td><td>${missing(a)}</td><td>${expired(a)}</td><td>${a.complaints}</td><td>${overdue(a)?"Yes":"No"}</td></tr>`).join("")}</table></div></div>`}
function vOver(){const A=S.apps,act=A.filter(a=>a.status==="Active"),od=act.filter(overdue),avg=Math.round(A.reduce((s,a)=>s+score(a),0)/A.length),mx=Math.max(1,...STAGES.map((_,i)=>act.filter(a=>a.stage===i).length)),low=[...A].sort((x,y)=>score(x)-score(y)).slice(0,3);
return head("Overview","Where every application stands today.")+`<div class="stats">${stat("Active files",act.length)+stat("Overdue and escalated",od.length)+stat("Average compliance",avg)+stat("Open complaints",A.reduce((s,a)=>s+a.complaints,0))}</div>
<div class="two"><div class="panel"><div class="ph"><h2>Files by stage</h2><button class="btn l" onclick="tick()">Simulate one day passing</button></div><div class="pb"><div class="cols">${STAGES.map((s,i)=>{const c=act.filter(a=>a.stage===i).length;return`<div><i style="height:${c/mx*110}px"></i><b>${c}</b><br>${s}</div>`}).join("")}</div></div></div>
<div><div class="panel"><div class="ph"><h2>Escalations</h2></div><div class="pb">${od.length?od.map(a=>`<div class="al r">${a.id} (${a.inst}) is ${a.days-SLA[a.stage]} day(s) past the ${STAGES[a.stage]} limit.</div>`).join(""):"Nothing overdue."}</div></div>
<div class="panel"><div class="ph"><h2>Lowest compliance</h2></div><div class="tw"><table>${low.map(a=>`<tr><td>${a.inst}</td><td><span class="pill ${cls(score(a))}">${score(a)}</span></td></tr>`).join("")}</table></div></div></div></div>`}
function tick(){S.apps.forEach(a=>{if(a.status==="Active")a.days++});S.log.unshift(stamp("System","Day advanced. Time limits updated"));toast("One day passed");render()}
function vAlerts(){const mine=role==="inst",A=mine?[S.apps[me]]:S.apps,al=A.flatMap(alerts).sort((x,y)=>y[0]-x[0]),a0=S.apps[me],lg=mine?S.log.filter(l=>l.who===a0.inst||l.what.includes(a0.id)):S.log;
return head("Alerts and activity",mine?"Alerts and history for "+a0.inst+".":"Every alert across institutions and a record of each action.")+`<div class="two"><div class="panel"><div class="ph"><h2>Alerts (${al.length})</h2></div><div class="pb">${al.map(x=>`<div class="al ${x[0]?"r":""}">${x[1]}</div>`).join("")||"No alerts."}</div></div>
<div class="panel"><div class="ph"><h2>Audit trail</h2></div><div class="pb">${lg.slice(0,20).map(l=>`<div class="lg">${l.t}<br><b>${l.who}</b>: ${l.what}</div>`).join("")||"No activity yet."}</div></div></div>`}
function vData(){return head("Data and backup","This prototype stores data in this browser only. The next version moves it to a shared database.")+`<div class="panel"><div class="pb"><p style="margin-top:0">Records saved: ${S.apps.length} applications, ${S.log.length} activity entries.</p>
<button class="btn" onclick="bk()">Download backup (.json)</button> <label class="btn l">Restore backup<input type="file" accept=".json" hidden onchange="rs(this.files[0])"></label> <button class="btn d" onclick="seed();me=0;toast('Demo data restored');render()">Restore sample data</button></div></div>`}
function bk(){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="clearpath-backup.json";a.click();URL.revokeObjectURL(u)}
function rs(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.apps)||!Array.isArray(d.log))throw 0;S=d;me=0;toast("Backup restored");render()}catch(e){toast("That file is not a valid backup")}};r.readAsText(f)}
const V={home:vHome,mine:vMine,queue:vQueue,comp:vComp,over:vOver,alerts:vAlerts,data:vData};
function render(){if(!NAV[role].some(n=>n[0]===page))page=NAV[role][1][0];
document.getElementById("nav").innerHTML=NAV[role].map(n=>`<button class="${n[0]===page?"on":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");
document.getElementById("who").textContent=ROLE[role];document.getElementById("app").innerHTML=V[page]();window.scrollTo(0,0);save()}
document.getElementById("role").onchange=function(){role=this.value;page=NAV[role][1][0];render()};
document.getElementById("coll").textContent=COLLEGE;
document.getElementById("foot").textContent="ClearPath prototype by "+COLLEGE+" for Smart India Hackathon. All data shown is demo data.";
load();render();
</script></body></html>
